[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 50
via_ir = true
bytecode_hash = "none"
cbor_metadata = false
sparse_mode = true
ignored_error_codes = [6546, 1878, 2394]
ffi = true

[profile.default.fuzz]
runs = 1000

# Gas limit settings based on DetoxHook analysis
[profile.default.gas]
limit = 900000  # Sufficient for real Pyth integration
price = 1000000000  # 1 gwei

# Test profile with higher limits for DetoxHook testing
[profile.test]
gas_limit = 1000000
gas_reports = ["*"]

# See more config options https://github.com/foundry-rs/foundry/tree/master/crates/config

[rpc_endpoints]
arbitrum_sepolia = "${ARBITRUM_SEPOLIA_RPC_URL}"
localhost = "http://localhost:8545"
anvil = "http://localhost:8545"
31337 = "http://localhost:8545"

[fmt]
line_length = 120
tab_width = 4
quote_style = "double"
bracket_spacing = true
int_types = "long"

# See more config options https://book.getfoundry.sh/reference/config/overview

fs_permissions = [
    { access = "read", path = "./broadcast" }
]